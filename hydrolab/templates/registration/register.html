{% extends 'hydrolab/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-5">
            <h2 class="text-center mb-4">Регистрация</h2>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" id="{{ field.id_for_label }}">
                    {% if field.help_text %}
                    <div class="form-text small">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                    <div class="text-danger small">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Зарегистрироваться</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
